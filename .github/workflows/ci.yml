name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux app (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/syncme-linux-$arch ./cmd/syncme
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/syncme-relay-linux-$arch ./cmd/syncme-relay
          done
      - uses: actions/upload-artifact@v4
        with:
          name: syncme-linux
          path: dist/

  e2e:
    name: End-to-end (Go daemon + relay vs Android sync core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Headless Wayland session (tests real clipboard integration)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q wl-clipboard sway
          export XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg && mkdir -p $XDG_RUNTIME_DIR && chmod 700 $XDG_RUNTIME_DIR
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c /dev/null > $RUNNER_TEMP/sway.log 2>&1 &
          sleep 3
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> $GITHUB_ENV
          echo "WAYLAND_DISPLAY=$(ls $XDG_RUNTIME_DIR | grep -m1 '^wayland-[0-9]$')" >> $GITHUB_ENV
      - run: go test -run TestWaylandClipboard -v ./internal/daemon/
      - run: scripts/e2e-test.sh

  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Sy --noconfirm git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/build-arch-in-container.sh
      - uses: actions/upload-artifact@v4
        with:
          name: syncme-arch-package
          path: dist/*.pkg.tar.zst

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: syncme-android-apk
          path: android/app/build/outputs/apk/*/*.apk
