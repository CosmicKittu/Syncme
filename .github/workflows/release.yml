name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.0.0"
        required: true

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Sy --noconfirm git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/build-arch-in-container.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  release:
    needs: arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux, macOS and Windows binaries + Ubuntu packages
        run: |
          make dist VERSION="${VERSION#v}"
          # stable names so ".../releases/latest/download/<name>" links always work
          for arch in amd64 arm64; do mv dist/syncme_*_$arch.deb dist/syncme-ubuntu-$arch.deb; done
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SYNCME_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SYNCME_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: APK
        working-directory: android
        env:
          SYNCME_KEYSTORE_PASSWORD: ${{ secrets.SYNCME_KEYSTORE_PASSWORD }}
          SYNCME_KEY_ALIAS: ${{ secrets.SYNCME_KEY_ALIAS }}
          SYNCME_KEY_PASSWORD: ${{ secrets.SYNCME_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../dist/syncme-android.apk
      - uses: actions/download-artifact@v4
        with:
          name: arch
          path: arch
      - run: cp arch/*.pkg.tar.zst dist/syncme-arch-x86_64.pkg.tar.zst
      - name: Installer scripts
        run: cp scripts/install.sh scripts/install-windows.ps1 dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Syncme ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
